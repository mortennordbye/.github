name: Dependabot CI failed

# Called from a `workflow_run` workflow in each repo. Flags a red Dependabot PR,
# which is the one case that needs a person.
on:
  workflow_call:

permissions:
  pull-requests: write

jobs:
  flag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          pr=$(gh pr list --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            echo "No open PR for $HEAD_BRANCH."
            exit 0
          fi
          gh pr edit "$pr" --add-label ci-failed --add-reviewer "$OWNER"
          gh pr comment "$pr" --body "$WORKFLOW failed on this update, so it will not merge by itself: $RUN_URL"
